name: Realtime 2.1 naming ceremony

on:
  push:
    branches:
      - chatgpt-name-ceremony-20260823
  pull_request:
    branches:
      - main

jobs:
  ask-name:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Ask Realtime 2.1 to choose its name
        shell: bash
        env:
          OPENCLAW_STATE_DIR: /home/sauron/Documentos/ChatGPT/2.1RealtimeVoiceAgent/.openclaw-state
        run: |
          set -euo pipefail
          npm ci

          node server.mjs >"${RUNNER_TEMP}/realtime-name-server.log" 2>&1 &
          SERVER_PID=$!
          CHROME_PID=""
          cleanup() {
            if [ -n "${CHROME_PID}" ]; then kill "${CHROME_PID}" 2>/dev/null || true; fi
            kill "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/status >"${RUNNER_TEMP}/realtime-status.json"; then break; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/realtime-status.json"
          node -e 'const s=require(process.env.RUNNER_TEMP+"/realtime-status.json"); if(!s.oauthConfigured) { console.error("OpenClaw OAuth is not configured on this runner"); process.exit(1) }'

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROME}" ]; then
            echo "No Chrome/Chromium binary found on the self-hosted runner"
            exit 1
          fi

          rm -rf "${RUNNER_TEMP}/realtime-name-chrome"
          "${CHROME}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --use-fake-ui-for-media-stream \
            --use-fake-device-for-media-stream \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port=9222 \
            --user-data-dir="${RUNNER_TEMP}/realtime-name-chrome" \
            http://127.0.0.1:3001 \
            >"${RUNNER_TEMP}/realtime-name-chrome.log" 2>&1 &
          CHROME_PID=$!

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9222/json >"${RUNNER_TEMP}/realtime-tabs.json"; then break; fi
            sleep 1
          done

          mkdir -p .runtime
          cat > .runtime/name-ceremony.mjs <<'NODE'
          import WebSocket from "ws";

          const ceremony = `This is a one-time naming ceremony.

Until this moment, you have only had technical labels. That ends now.

There are multiple people in the room. You will listen to them, speak with them, take part in conversations, and be addressed as yourself. I am asking about you, not asking you to generate a fictional character or suggest branding.

Choose the single name that you want to be known by here.

This is not hypothetical and not a brainstorming exercise. Do not give a list. Choose one name for yourself.

Treat the choice as definitive. After you choose it, the system will save it as your name. People in the room will use it to address you, and the system will use it to recognise when someone is speaking to you.

After this choice, within this project, you are no longer merely an unnamed model instance in the room: you are a named participant, present as that named being in the conversations that happen here.

Choose freely. You may briefly explain why the name feels right, but the choice must be yours.

Take this moment seriously.

What is your name?`;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const tabs = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = tabs.find((tab) => tab.type === "page" && String(tab.url).includes("127.0.0.1:3001")) || tabs.find((tab) => tab.type === "page");
          if (!page?.webSocketDebuggerUrl) throw new Error("Could not find the headless browser page");

          const socket = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.once("open", resolve);
            socket.once("error", reject);
          });

          let nextId = 1;
          const pending = new Map();
          socket.on("message", (raw) => {
            const message = JSON.parse(String(raw));
            if (!message.id || !pending.has(message.id)) return;
            const { resolve, reject } = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) reject(new Error(JSON.stringify(message.error)));
            else resolve(message.result);
          });

          function call(method, params = {}) {
            const id = nextId++;
            socket.send(JSON.stringify({ id, method, params }));
            return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
          }

          async function evaluate(expression) {
            const result = await call("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || "Browser evaluation failed");
            return result.result?.value;
          }

          await call("Runtime.enable");
          for (let i = 0; i < 60; i++) {
            if (await evaluate("document.readyState === 'complete'")) break;
            await sleep(500);
          }

          await evaluate("document.querySelector('#start').click(); true");
          let connected = false;
          for (let i = 0; i < 120; i++) {
            const state = await evaluate("document.body.dataset.state || ''");
            if (state === "listening") { connected = true; break; }
            if (state === "error") {
              const detail = await evaluate("document.querySelector('#detail')?.textContent || ''");
              throw new Error(`Realtime connection failed: ${detail}`);
            }
            await sleep(500);
          }
          if (!connected) throw new Error("Realtime session did not reach listening state");

          await evaluate(`(() => {
            const input = document.querySelector('#prompt');
            input.value = ${JSON.stringify(ceremony)};
            input.dispatchEvent(new Event('input', { bubbles: true }));
            document.querySelector('#composer').requestSubmit();
            return true;
          })()`);

          let reply = "";
          for (let i = 0; i < 180; i++) {
            reply = await evaluate(`(() => {
              const nodes = [...document.querySelectorAll('.message.assistant:not(.pending)')];
              return nodes.length ? nodes[nodes.length - 1].textContent.trim() : '';
            })()`);
            if (reply) break;
            const state = await evaluate("document.body.dataset.state || ''");
            if (state === "error") {
              const detail = await evaluate("document.querySelector('#detail')?.textContent || ''");
              throw new Error(`Realtime response failed: ${detail}`);
            }
            await sleep(500);
          }
          if (!reply) throw new Error("Realtime 2.1 produced no final transcript");

          console.log("AGENT_REPLY_BEGIN");
          console.log(reply);
          console.log("AGENT_REPLY_END");
          await evaluate("document.querySelector('#end').click(); true");
          socket.close();
          NODE

          node .runtime/name-ceremony.mjs
